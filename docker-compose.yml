version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: validastock_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: validastock
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: